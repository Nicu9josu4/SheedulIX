version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schedulix_db_container
    restart: always
    environment:
      POSTGRES_DB: schedulix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schedulix_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

# To start: docker compose -f postgres-compose.yml up -d
# To Stop: .
docker compose -f postgres-compose.yml down
# Everything else regarding your credentials, .NET Web API connection string (localhost:5432), and pgAdmin access (http://localhost:5050) remains identical

# Access Web IDE (pgAdmin):
# Open your browser and navigate to http://localhost:5050

# Email: admin@admin.com

# Password: admin

# Register the PostgreSQL Server in pgAdmin:

# In pgAdmin, click Add New Server.

# General tab: Enter a Name (e.g., Schedulix Local).

# Connection tab:

# Host name/address: postgres (use the Docker service name, or host.docker.internal if connecting outside the bridge network)

# Port: 5432

# Maintenance database: schedulix_db

# Username: postgres

# Password: password

# Click Save.